<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>Trường Tiểu Học Lê Lợi - Đang chuyển hướng...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 to index.html with query/hash
      var segmentCount = 1;
      var location = window.location;
      location.replace(
        location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        location.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px; background: #064e3b; color: white;">
    <h2>Trường Tiểu Học Lê Lợi - Pơng Drang, Đắk Lắk</h2>
    <p>Đang tải trang, vui lòng chờ trong giây lát...</p>
    <p><a href="./" style="color: #fbbf24; text-decoration: underline;">Bấm vào đây nếu không tự động chuyển hướng</a></p>
  </body>
</html>
