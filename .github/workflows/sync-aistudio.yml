name: Dong bo AI Studio ve website

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      include_auth_core_files:
        description: 'Dong bo co kiem soat 6 tep dang nhap Google, phu huynh va tra cuu hoc sinh (tao PR, khong tu dong Merge)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-aistudio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout website chinh
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Checkout AI Studio Private
        uses: actions/checkout@v4
        with:
          repository: truongthleloipongdrang/truongthleloi-aistudio
          ref: main
          token: ${{ secrets.AISTUDIO_READ_TOKEN }}
          persist-credentials: false
          path: aistudio-source

      - name: Kiem tra ma nguon
        run: |
          test -d aistudio-source/src
          test -f aistudio-source/package.json
          test -d src
          echo "Da ket noi hai kho GitHub"

      - name: Dong bo ma nguon duoc phep
        env:
          INCLUDE_AUTH_CORE: ${{ github.event_name == 'workflow_dispatch' && inputs.include_auth_core_files == true }}
        run: |
          # Luon bao ve cac tep du lieu, luu tru va cau hinh rieng cua website chinh
          COMMON_EXCLUDES=(
            --exclude='data.ts'
            --exclude='admissionsStorage.ts'
            --exclude='feedbackStorage.ts'
            --exclude='siteContentSync.ts'
            --exclude='geminiConfig.ts'
            --exclude='.env*'
          )

          if [ "$INCLUDE_AUTH_CORE" = "true" ]; then
            echo "Che do tich hop co kiem soat (include_auth_core_files=true): chi mo dong bo 6 tep xac thuc/tra cuu/quan tri vao PR. Khong ghi de firestore.rules, khong tu dong Merge."
            rsync -a \
              "${COMMON_EXCLUDES[@]}" \
              aistudio-source/src/ src/
          else
            echo "Che do mac dinh an toan (include_auth_core_files=false): tiep tuc bao ve toan bo tep quan tri va Firebase."
            rsync -a \
              "${COMMON_EXCLUDES[@]}" \
              --exclude='App.tsx' \
              --exclude='onlineStore.ts' \
              --exclude='studentExcelHelper.ts' \
              --exclude='components/AdminModal.tsx' \
              --exclude='components/MemberLoginModal.tsx' \
              --exclude='components/StudentLookupSection.tsx' \
              aistudio-source/src/ src/
          fi

          echo "Danh sach thay doi:"
          git status --short -- src/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Kiem tra thu vien giua hai kho
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('aistudio-source/package.json', 'utf8'));
          const target = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          let mismatched = false;

          for (const group of ['dependencies', 'devDependencies']) {
            const a = source[group] || {};
            const b = target[group] || {};
            const names = new Set([...Object.keys(a), ...Object.keys(b)]);
            for (const name of names) {
              if (a[name] !== b[name]) {
                mismatched = true;
                console.log(group + ': ' + name + ': source=' + (a[name] || 'missing') + ', target=' + (b[name] || 'missing'));
              }
            }
          }

          if (mismatched) {
            console.error('Thu vien hai kho khac nhau. Can kiem tra truoc khi dong bo.');
            process.exit(1);
          }

          console.log('Danh sach thu vien khop nhau.');
          NODE

      - name: Kiem tra file can xu ly rieng
        run: |
          for file in App.tsx onlineStore.ts studentExcelHelper.ts siteContentSync.ts components/AdminModal.tsx components/MemberLoginModal.tsx components/StudentLookupSection.tsx
          do
            if ! diff -q "aistudio-source/src/$file" "src/$file" > /dev/null 2>&1; then
              echo "::warning::Can kiem tra thu cong: src/$file"
            fi
          done

          if [ -f aistudio-source/firestore.rules ]; then
            if ! cmp -s aistudio-source/firestore.rules firestore.rules; then
              echo "::warning::firestore.rules khac nhau. Can kiem tra va phe duyet rieng (khong tu dong ghi de hay trien khai)."
            fi
          fi

      - name: Install dependencies
        run: bun install

      - name: Kiem tra TypeScript
        run: npx tsc --noEmit

      - name: Build website
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_ADMIN_EMAIL: ${{ vars.VITE_FIREBASE_ADMIN_EMAIL }}

      - name: Tao Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: auto/aistudio-sync
          base: main
          add-paths: src
          delete-branch: true
          commit-message: "Sync safe AI Studio source changes"
          title: "Cap nhat website tu Google AI Studio"
          body: |
            Dong bo ma nguon tu kho AI Studio Private.

            Da kiem tra thu vien, TypeScript va Build truoc khi tao PR.

            Khong tu dong thay the hoac trien khai:
            - Cau hinh trien khai GitHub
            - Firestore Security Rules (firestore.rules)
            - Du lieu goc (data.ts, admissionsStorage.ts, feedbackStorage.ts, siteContentSync.ts, geminiConfig.ts)
            - File cau hinh nhay cam (.env*)

            Can xem Files changed va kiem tra
            giao dien truoc khi Merge.

            PR nay khong tu dong Merge.
