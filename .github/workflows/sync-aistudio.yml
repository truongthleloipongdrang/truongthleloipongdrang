name: Dong bo AI Studio ve website

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      include_content_management_files:
        description: 'Dong bo nhom tep giao dien & quan ly noi dung (App.tsx, AdminModal.tsx, siteContentSync.ts, Quan ly Hoat dong & Thu vien anh)'
        required: false
        default: true
        type: boolean
      include_auth_core_files:
        description: 'Dong bo co kiem soat nhom tep xac thuc Firebase, dang nhap Google/phu huynh va tra cuu hoc sinh (tao PR, khong tu dong Merge)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-aistudio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout website chinh
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Checkout AI Studio Private
        uses: actions/checkout@v4
        with:
          repository: truongthleloipongdrang/truongthleloi-aistudio
          ref: main
          token: ${{ secrets.AISTUDIO_READ_TOKEN }}
          persist-credentials: false
          path: aistudio-source

      - name: Kiem tra ma nguon
        run: |
          test -d aistudio-source/src
          test -f aistudio-source/package.json
          test -d src
          echo "Da ket noi hai kho GitHub"

      - name: Dong bo ma nguon duoc phep
        id: sync_files
        env:
          INCLUDE_CONTENT_MGMT: ${{ github.event_name != 'workflow_dispatch' || inputs.include_content_management_files == true }}
          INCLUDE_AUTH_CORE: ${{ github.event_name == 'workflow_dispatch' && inputs.include_auth_core_files == true }}
        run: |
          # 1. Luon bao ve tuyet doi cac tep du lieu goc, luu tru rieng va cau hinh nhay cam
          ALWAYS_EXCLUDES=(
            --exclude='data.ts'
            --exclude='admissionsStorage.ts'
            --exclude='feedbackStorage.ts'
            --exclude='geminiConfig.ts'
            --exclude='.env*'
          )

          # 2. Nhom tep giao dien & quan ly noi dung (mac dinh BAT de dong bo day du Quan Ly Hoat Dong & Thu Vien Anh)
          CONTENT_MGMT_EXCLUDES=()
          if [ "$INCLUDE_CONTENT_MGMT" != "true" ]; then
            CONTENT_MGMT_EXCLUDES=(
              --exclude='App.tsx'
              --exclude='siteContentSync.ts'
              --exclude='components/AdminModal.tsx'
            )
          fi

          # 3. Nhom tep xac thuc Firebase, phu huynh va du lieu 19 hoc sinh (mac dinh BAO VE, chi mo khi include_auth_core_files=true)
          AUTH_CORE_EXCLUDES=()
          if [ "$INCLUDE_AUTH_CORE" != "true" ]; then
            AUTH_CORE_EXCLUDES=(
              --exclude='onlineStore.ts'
              --exclude='firebaseAuthStore.ts'
              --exclude='studentExcelHelper.ts'
              --exclude='components/MemberLoginModal.tsx'
              --exclude='components/StudentLookupSection.tsx'
            )
          fi

          echo "Che do dong bo: include_content_management_files=$INCLUDE_CONTENT_MGMT | include_auth_core_files=$INCLUDE_AUTH_CORE"

          rsync -a \
            "${ALWAYS_EXCLUDES[@]}" \
            "${CONTENT_MGMT_EXCLUDES[@]}" \
            "${AUTH_CORE_EXCLUDES[@]}" \
            aistudio-source/src/ src/

          # Xac minh day du cac tep quan ly noi dung bat buoc da co mat trong website chinh
          REQUIRED_CONTENT_FILES=(
            src/components/AdminGalleryManager.tsx
            src/components/AdminActivitiesManager.tsx
            src/components/ImageUrlPreview.tsx
            src/components/AdminModal.tsx
            src/components/ActivitiesSection.tsx
            src/components/GallerySection.tsx
            src/siteContentSync.ts
            src/types.ts
            src/mediaHelpers.ts
            src/App.tsx
          )
          for req in "${REQUIRED_CONTENT_FILES[@]}"; do
            if [ ! -f "$req" ]; then
              echo "::error::Thieu tep quan ly noi dung bat buoc sau khi dong bo: $req"
              exit 1
            fi
          done

          CHANGED_LIST=$(git status --short -- src/)
          CHANGED_COUNT=$(printf '%s\n' "$CHANGED_LIST" | sed '/^$/d' | wc -l | tr -d ' ')
          echo "Tong so tep thay doi trong src/: $CHANGED_COUNT"
          echo "$CHANGED_LIST"

          {
            echo "changed_count=$CHANGED_COUNT"
            echo "changed_files<<EOF"
            if [ -n "$CHANGED_LIST" ]; then
              echo "$CHANGED_LIST"
            else
              echo "(Khong co tep nao thay doi)"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Kiem tra thu vien giua hai kho
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('aistudio-source/package.json', 'utf8'));
          const target = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          let mismatched = false;

          for (const group of ['dependencies', 'devDependencies']) {
            const a = source[group] || {};
            const b = target[group] || {};
            const names = new Set([...Object.keys(a), ...Object.keys(b)]);
            for (const name of names) {
              if (a[name] !== b[name]) {
                mismatched = true;
                console.log(group + ': ' + name + ': source=' + (a[name] || 'missing') + ', target=' + (b[name] || 'missing'));
              }
            }
          }

          if (mismatched) {
            console.error('Thu vien hai kho khac nhau. Can kiem tra truoc khi dong bo.');
            process.exit(1);
          }

          console.log('Danh sach thu vien khop nhau.');
          NODE

      - name: Kiem tra file duoc bao ve
        run: |
          for file in data.ts admissionsStorage.ts feedbackStorage.ts geminiConfig.ts onlineStore.ts firebaseAuthStore.ts studentExcelHelper.ts components/MemberLoginModal.tsx components/StudentLookupSection.tsx
          do
            if ! diff -q "aistudio-source/src/$file" "src/$file" > /dev/null 2>&1; then
              echo "::warning::Tep duoc bao ve co su khac biet (can kiem tra thu cong neu muon cap nhat): src/$file"
            fi
          done

          if [ -f aistudio-source/firestore.rules ]; then
            if ! cmp -s aistudio-source/firestore.rules firestore.rules; then
              echo "::warning::firestore.rules khac nhau. Can kiem tra va phe duyet rieng (khong tu dong ghi de hay trien khai)."
            fi
          fi

      - name: Install dependencies
        run: bun install

      - name: Kiem tra TypeScript
        run: npx tsc --noEmit

      - name: Build website
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_ADMIN_EMAIL: ${{ vars.VITE_FIREBASE_ADMIN_EMAIL }}

      - name: Tao Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: auto/aistudio-sync
          base: main
          add-paths: src
          delete-branch: true
          commit-message: "Sync AI Studio content management and safe UI changes"
          title: "Cap nhat website tu Google AI Studio (Quan ly noi dung & giao dien)"
          body: |
            Dong bo ma nguon tu kho AI Studio Private.

            Da kiem tra thu vien, TypeScript (`npx tsc --noEmit`) va Build (`npm run build`) truoc khi tao PR.

            ### Danh sach tep thay doi (${{ steps.sync_files.outputs.changed_count }} tep)
            ```
            ${{ steps.sync_files.outputs.changed_files }}
            ```

            ### Cac tep luon duoc bao ve (khong tu dong ghi de):
            - Cau hinh trien khai GitHub (`.github/workflows/*`)
            - Firestore Security Rules (`firestore.rules`)
            - Du lieu goc & luu tru rieng (`data.ts`, `admissionsStorage.ts`, `feedbackStorage.ts`, `geminiConfig.ts`)
            - File cau hinh nhay cam (`.env*`)
            - Nhom xac thuc & 19 hoc sinh (`onlineStore.ts`, `firebaseAuthStore.ts`, `studentExcelHelper.ts`, `MemberLoginModal.tsx`, `StudentLookupSection.tsx` - chi mo khi bat `include_auth_core_files=true`)

            Can xem tab **Files changed** va kiem tra giao dien truoc khi Merge.
            PR nay khong tu dong Merge.
