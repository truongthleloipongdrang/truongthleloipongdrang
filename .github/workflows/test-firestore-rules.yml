name: Kiem thu Firestore Rules (Emulator)

on:
  push:
    branches:
      - test/aistudio-full-sync
    paths:
      - 'tests/firestore.rules'
      - 'tests/rules-runner/**'
      - '.github/workflows/test-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        working-directory: tests/rules-runner
        run: npm install --no-audit --no-fund
      
      - name: Kiem tra hai file Firestore Rules giong nhau
        run: |
          cmp tests/firestore.rules tests/rules-runner/firestore.rules
          echo "Hai file Firestore Rules giong nhau."

      - name: Run Firestore Emulator tests
        working-directory: tests/rules-runner
        run: npx firebase emulators:exec --project demo-leloi-firestore-rules --only firestore --config firebase.json "npm test"
