
name: Test Integrated Website Safely

on:
  push:
    branches:
      - test/website-integrated-safe

permissions:
  contents: read

jobs:
  check:
    name: TypeScript and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build website
        run: npm run build
